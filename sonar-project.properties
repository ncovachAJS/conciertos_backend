sonar.projectKey=ncovachAJS_conciertos_backend
sonar.projectName=Conciertos Backend
sonar.projectVersion=1.0
sonar.organization=ncovachajs-1

# Fuentes
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Exclusiones de análisis (Issues + Duplicación)
# Los spec files se excluyen del análisis de issues y duplicación;
# la cobertura la aportan a través del lcov.info externo.
sonar.exclusions=\
  src/main.ts,\
  src/**/*.module.ts,\
  src/**/*.spec.ts,\
  src/prisma/**,\
  dist/**,\
  node_modules/**,\
  coverage/**

# Cobertura (generada por jest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de cobertura:
# - Código generado / bootstrap
# - DTOs, entidades, módulos
# - Infraestructura externa (Firebase FCM, Resend email, Spotify API,
#   Ticketmaster, Cloudinary, JWT Passport strategy, filtros HTTP)
# - Photos (depende de Cloudinary + Prisma complejas sin valor de negocio puro)
sonar.coverage.exclusions=\
  src/main.ts,\
  src/**/*.module.ts,\
  src/**/*.dto.ts,\
  src/**/*.entity.ts,\
  src/prisma/**,\
  src/app.controller.ts,\
  src/app.service.ts,\
  src/email/**,\
  src/spotify/**,\
  src/recommendations/**,\
  src/uploads/**,\
  src/photos/**,\
  src/common/**,\
  src/auth/jwt.strategy.ts,\
  src/notifications/notifications.service.ts

# Exclusiones de duplicación:
# Los spec files tienen patrones repetitivos propios de los tests (mocks, beforeEach, etc.)
# Se excluyen también de sonar.exclusions para que no cuenten en ninguna métrica de duplicación.
sonar.cpd.exclusions=src/**/*.spec.ts

# Encoding
sonar.sourceEncoding=UTF-8
